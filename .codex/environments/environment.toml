version = 1
name = "lauyim"

[setup]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

Write-Output "=== DIAGNOSTICO ==="
Write-Output "PATH: $env:PATH"
where.exe node
where.exe nvm
nvm list
nvm use 22
node -v
Write-Output "=== FIN DIAGNOSTICO ==="

pip install -r requirements.txt
pnpm install'''

[setup.win32]
script = '''
Set-Location $env:CODEX_WORKTREE_PATH

$nodeDir = "$env:USERPROFILE\.codex-node22"
if (-not (Test-Path "$nodeDir\node.exe")) {
    New-Item -ItemType Directory -Force -Path $nodeDir | Out-Null
    Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip" -OutFile "$env:TEMP\node22.zip"
    Expand-Archive -Path "$env:TEMP\node22.zip" -DestinationPath $env:TEMP -Force
    Copy-Item "$env:TEMP\node-v22.23.2-win-x64\*" -Destination $nodeDir -Recurse -Force
}

$env:PATH = "$nodeDir;$env:PATH"
node -v

corepack enable
pip install -r requirements.txt
pnpm install'''

[cleanup]
script = '''
docker compose down --remove-orphans
rm -rf .cache/tmp'''

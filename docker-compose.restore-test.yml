name: restore-test

services:
  api:
    image: lauyim-api:local
    restart: "no"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: localhost
      ORIGIN: http://localhost:3099
      RP_NAME: openGym restore test
      INVITE_ONLY: "false"
      ALLOW_GUEST: "true"
    volumes:
      - ./restore-test-data:/data
    networks:
      - restore-test

  web:
    image: lauyim-web:local
    restart: "no"
    depends_on:
      - api
    ports:
      - "3099:80"
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
    networks:
      - restore-test

networks:
  restore-test:
    name: restore-test-network

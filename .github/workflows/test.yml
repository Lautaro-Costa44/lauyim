# Runs on pull requests and on pushes to main.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend
      # Backend (node --test): billing, sync, DB y un recorrido HTTP que levanta server.js.
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api

  # Backup, restore y chequeo de disco con docker, rclone, curl y df falsos: corren en el servidor
  # de cada gym, así que tienen que pasar en Linux (en Windows, node y tar no se entienden con
  # las rutas /tmp de bash).
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash scripts/tests/backup-restore.test.sh
      - run: bash scripts/tests/disk-check.test.sh
